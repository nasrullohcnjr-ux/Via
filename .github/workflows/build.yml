name: Build Android App (Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup Node.js with automated npm dependency caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 2. Setup Java JDK 17 with automated Gradle caching
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Install Web & Capacitor Dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Build Web Assets & Sync with Native Android Project
      - name: Build Web App & Sync Capacitor
        run: |
          npm run build --if-present
          npx cap sync android

      # 5. Grant Execute Permission for Gradle Wrapper
      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      # 6. Build Unsigned APK / AAB
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      # 7. Decode Keystore & Sign Release APK (If Secrets are Configured)
      - name: Sign APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      # 8. Upload Build Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14import { CapacitorConfig } from '@capacitor/cli';

const config: CapacitorConfig = {
  appId: 'com.via.app',
  appName: 'Via',
  webDir: 'dist', // Match your build output folder ('dist', 'www', or 'build')
  bundledWebRuntime: false,
  
  server: {
    // Uses standard HTTPS schema inside the Android WebView (fixes CORS and modern cookie issues)
    androidScheme: 'https',
    cleartext: false
  },

  android: {
    // Improves scrolling performance and WebView behavior
    allowMixedContent: false,
    captureInput: true,
    backgroundColor: '#ffffff',
    // Helps with keyboard resizing behavior
    adjustPan: true
  },

  plugins: {
    SplashScreen: {
      launchShowDuration: 1500,
      launchAutoHide: true,
      backgroundColor: "#ffffff",
      androidScaleType: "CENTER_CROP",
      showSpinner: false
    }
  }
};

export default config;

